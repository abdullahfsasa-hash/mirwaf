<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>طباعة</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Noto Sans Arabic",Tahoma,sans-serif;color:#111;background:#eee}
.bar{padding:10px;text-align:center;background:#fff;border-bottom:1px solid #ddd}.bar button{padding:8px 18px;font:inherit;cursor:pointer}
.page{background:#fff;margin:14px auto;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.a4{width:210mm;min-height:297mm;padding:16mm}
.lab{width:100mm;height:150mm;padding:6mm;font-size:13px;display:flex;flex-direction:column;gap:5mm}
h1{margin:0;font-size:22px}h2{margin:0 0 4px;font-size:15px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;margin-bottom:12px}th,td{border-bottom:1px solid #ccc;padding:7px 6px;text-align:start}th{background:#f3f3f3;font-size:12px}
.tot{margin-inline-start:auto;width:60%}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font-weight:700;border-top:2px solid #111;font-size:16px}
.box{border:2px solid #111;padding:3mm}.big{font-size:20px;font-weight:700}.mut{color:#555}.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.foot{margin-top:auto;font-size:11px;color:#555;text-align:center}
@page{margin:0}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><button id="pb">طباعة</button></div>
<div id="out"></div>
<script src="/admin/print.js" defer></script>
</body>
</html>
